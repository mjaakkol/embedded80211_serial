# Role: host driver.
CONFIG_SERIAL_HOST_ROLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# embedded80211 host drivers.
CONFIG_EMBEDDED80211_HOST_BUS=y
CONFIG_EMBEDDED80211_HOST_WIFI=y
CONFIG_EMBEDDED80211_HOST_BT=y

# Networking (virtual Wi-Fi).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Bluetooth (virtual HCI).
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="e80211-host"

# Logging / console.
CONFIG_LOG=y
CONFIG_CONSOLE=y

# The bus client's sync handshake (bus_open -> bus_sync) needs more than the
# 1024 B default main stack; a smaller stack overflows and faults at boot.
CONFIG_MAIN_STACK_SIZE=4096
