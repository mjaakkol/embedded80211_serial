# Role: host driver.
CONFIG_SERIAL_HOST_ROLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# embedded80211 host drivers.
CONFIG_EMBEDDED80211_HOST_BUS=y
CONFIG_EMBEDDED80211_HOST_WIFI=y
CONFIG_EMBEDDED80211_HOST_BT=y

# Networking (virtual Wi-Fi).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
CONFIG_NET_UDP=y
CONFIG_NET_LOG=y
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=64
# Accept broadcast L2 frames with L3 dst not yet matching the interface
# broadcast (needed before DHCP assigns an address).
CONFIG_NET_L2_ETHERNET_ACCEPT_MISMATCH_L3_L2_ADDR=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Bluetooth (virtual HCI).
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="e80211-host"

# Logging / console.
CONFIG_LOG=y
CONFIG_CONSOLE=y

# The bus client's sync handshake (bus_open -> bus_sync) needs more than the
# 1024 B default main stack; a smaller stack overflows and faults at boot.
# 4096 and 8192 were both insufficient with the full net+BT subsystem;
# the init path (net_if + DHCP + BT controller) consumes ~8 KB of stack.
CONFIG_MAIN_STACK_SIZE=16384

# The network stack's RX processing (net_if_recv_data -> DHCP -> ARP) runs
# on the system workqueue; the default 1024 B overflows and stalls RX,
# exhausting the net_buf pool.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# CRC32C for the link-protocol integrity feature (bus.c / serial_frame_crc).
CONFIG_CRC=y
CONFIG_CRC32_C=y
