#
# Network core (nrf7002dk/nrf5340/cpunet) configuration for the
# ipc_radio image: Bluetooth controller (SDC) serialized to the
# application core over HCI IPC, plus Wi-Fi coexistence (PTA) with
# the nRF7002. The nrf_radio_coex devicetree node is provided by the
# board (nrf7002dk_nrf5340_cpunet.dts).
#

# Radio coexistence with the nRF7002 Wi-Fi radio (PTA interface).
# MPSL_CX_NRF700X is the default choice when a nordic,nrf7002-coex
# node is present; both are set explicitly for clarity.
CONFIG_MPSL_CX=y
CONFIG_MPSL_CX_NRF700X=y

# HCI buffer pools sized for host-driven raw HCI traffic.
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255

# The controller never connects autonomously; the host drives all
# operations over the raw HCI channel. Keep the connection pool
# minimal.
CONFIG_BT_MAX_CONN=2

# Diagnostics: the net core has no visible UART, so route logs over
# RTT for debugging (J-Link RTT).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Net core has only 64 KB RAM; keep the RTT up-buffer small.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
