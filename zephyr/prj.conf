CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
CONFIG_NRF_WIFI_RPU_RECOVERY=y

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="Myssid"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="Mypassword"

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=n

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16

# Below section is the primary contributor to SRAM and is currently
# tuned for performance, but this will be revisited in the future.
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=37000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
CONFIG_NET_TC_TX_COUNT=1

#CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_INIT_STACKS=y

CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_NET_SOCKETS_POLL_MAX=10

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_STA_SAMPLE_START_WIFI_THREAD_STACK_SIZE=5200

# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_SHELL_CMDS_RESIZE=n


# Kernel options
CONFIG_ENTROPY_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048

#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.99"
#CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
#CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Nanopb
CONFIG_NANOPB=y

# Enable USB Subsystem (new USB device stack)
CONFIG_USB_DEVICE_STACK_NEXT=y

# Enable CDC ACM class for USB device stack next
CONFIG_USBD_CDC_ACM_CLASS=y

# Initialize and enable CDC ACM serial backend at boot
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
# Single instance mode registers "cdc_acm_0" = first zephyr,cdc-acm-uart node
# (cdc_serial_uart, the multiplexer's USB backend bound by serial_usb.c).
# MULTIPLE_INSTANCES=y would instead only expose the chosen console/shell/mcumgr
# UARTs (zephyr,console = cdc_serial_uart2), leaving the multiplexer port
# unregistered and invisible to the host.
CONFIG_CDC_ACM_SERIAL_MULTIPLE_INSTANCES=n

# Temporary USB VID/PID for testing
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_PID=0x0001
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="My Zephyr CDC-ACM Device"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Test Vendor"

# Serial
CONFIG_SERIAL=y
 # Needed for USB CDC ACM. Aysynchronous serial port
# API would be better for all other serial ports.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable RTT (Real-Time Transfer)
CONFIG_RTT_CONSOLE=y

# Choose SEGGER RTT as the backend (most common)
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=131072
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
# Re-init the RTT control block unconditionally on every boot. The CB lives in
# a persistent section (not zeroed by startup), so the default strong-check
# mode reuses offsets left by the previous boot: the ring stays full of stale
# data and the skip-mode log writer drops everything new. Fresh ring per boot.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

CONFIG_UART_CONSOLE=y

# Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=4

# Enable events
CONFIG_EVENTS=y