CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
# Station-only, PSK/WPA2-CCMP: disable WPA3/SAE and legacy (WEP/TKIP/MD5/RC4)
# crypto to cut flash. This co-processor never uses SAE, WEP, or TKIP.
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_EXT=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_INT=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=n
# Low power must be disabled for monitor-mode raw RX capture: with LPM the
# nRF7002 RPU puts the radio to sleep after ~10 ms idle, and in monitor mode
# there is no beacon/DTIM to wake it, so air frames are never captured.
# (Reference: nrf/tests/drivers/nrf_wifi/raw_tx_rx/prj.conf.)
# Note: this also disables CONFIG_NRF_WIFI_RPU_RECOVERY (depends on LPM).
CONFIG_NRF_WIFI_LOW_POWER=n
# Force a valid unicast station MAC. The default (CONFIG_WIFI_OTP_MAC_ADDRESS)
# makes nrf_wifi_get_mac_addr() write a dummy/garbage first octet with the
# multicast bit set (observed 03:06:f4:ce:36:00 on the bus); a DHCP server
# rejects DISCOVERs from such a source, so no OFFER ever returns. A fixed
# unicast MAC (bit0/bit1 of the first octet clear) fixes DHCP.
CONFIG_WIFI_FIXED_MAC_ADDRESS="62:34:56:78:9a:bc"

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=n

# Data proxy (co-processor) mode: the FMAC handles MAC filtering on the
# device MAC (00:00:00:00:00:00:01, which is also the host's MAC). Every L2
# frame the FMAC delivers is forwarded to the host over the bus via the
# nrf_wifi_if_rx_frm_hook (see wifi_data.c). Monitor/sniffer mode
# (PROMISC/RAW_DATA_RX) is NOT used here: it delivers every air frame
# (beacons, other clients) and breaks STA operation.
CONFIG_NRF70_RAW_DATA_TX=y
# Engineering: raw RX capture for broadcast-echo validation
CONFIG_WIFI_RAW_RX=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NRF70_RX_NUM_BUFS=8

# Below section is the primary contributor to SRAM. Sized to fit the
# original 192 KB non-secure SRAM partition (was tuned for performance).
# Heap enlarged for wpa_supplicant (WPA state machine + EAPOL + ctrl iface
# need ~60 KB total; the 30 KB HEAP_MEM_POOL_ADD_SIZE_HOSTAP is added on
# top of HEAP_MEM_POOL_SIZE by the hostap module). Net bufs trimmed to
# compensate.
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_HEAP_MEM_POOL_SIZE=32000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=12000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=16000
CONFIG_NET_TC_TX_COUNT=1

#CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_INIT_STACKS=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_NET_SOCKETS_POLL_MAX=10

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_STA_SAMPLE_START_WIFI_THREAD_STACK_SIZE=5200

# Debugging
CONFIG_STACK_SENTINEL=y
# The FMAC RPC/RX path (incl. the embedded80211 RX hook) overflows the
# default RPMSG workqueue stack at boot when beacons are delivered.
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=4096
# Main thread runs net_if / Wi-Fi init; 5200 bytes is fully consumed at boot.
CONFIG_MAIN_STACK_SIZE=6144
# The "wlan0" net-if management thread overflows at 4600 bytes during
# FMAC-init RPC handling; bump to 8192.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=6144
CONFIG_SHELL_CMDS_RESIZE=n


# Kernel options
CONFIG_ENTROPY_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
# USB stack logging: WRN to keep boot log short so Wi-Fi connect logs fit
# in the 4 KB RTT ring (NO_BLOCK_SKIP drops everything once full).
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
# TEMP: connect-timeout diagnosis — WPA supplicant debug logs (level 1 = MSG_DEBUG).
# Remove once the -116 ETIMEDOUT root cause is found.
#CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_DBG=y
#CONFIG_WIFI_NM_WPA_SUPPLICANT_DEBUG_LEVEL=1
# Free flash for the debug logging above (not needed for basic STA connect).
#CONFIG_WIFI_NM_WPA_SUPPLICANT_ADVANCED_FEATURES=n

# Nanopb
CONFIG_NANOPB=y

# Bluetooth LE
# The controller is the nRF5340 on-chip SoftDevice Controller running on the
# network core (the ipc_radio netcore image, see Kconfig.sysbuild). The
# application core exposes a raw HCI channel to the host over the common
# link protocol (traffic type HCI, see src/bt_proxy.c).
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

# Serial transport: the nRF5340 target USB connector (see app.overlay)
# exposes the common link protocol bus as USB CDC-ACM (CDC_ACM_0).
# The J-Link USB connector carries only SWD flash/debug and SEGGER RTT.

# Enable USB Subsystem (new USB device stack)
CONFIG_USB_DEVICE_STACK_NEXT=y
# The USB device controller (UDC NRF) thread handles CDC-ACM ISR events and
# overflows the default 512-byte stack at boot. Bump to 2048.
#CONFIG_UDC_NRF_THREAD_STACK_SIZE=4096

# Enable CDC ACM class for USB device stack next
CONFIG_USBD_CDC_ACM_CLASS=y

# Keep vserial for console, but don't proxy it to USB (prevents console
# output from corrupting the protocol data channel on CDC_ACM_0)
CONFIG_VSERIAL_ENABLE=y
CONFIG_SERIAL_MUX_VSERIAL_IFACE_UART=y
# Disable early console to prevent boot banner from corrupting CDC ACM data
CONFIG_EARLY_CONSOLE=n

# The USB device stack is initialized explicitly at boot by
# embedded80211/zephyr/device/serial/usbd_init.c (USBD_DEVICE_DEFINE +
# usbd_init()/usbd_enable()). It registers the first zephyr,cdc-acm-uart
# instance ("cdc_acm_0" = cdc_serial_uart, the multiplexer's USB backend
# bound by serial_usb.c). The VID/PID and descriptor strings are defined
# in usbd_init.c.

# Serial
CONFIG_SERIAL=y
 # Needed for USB CDC ACM. Aysynchronous serial port
# API would be better for all other serial ports.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable RTT (Real-Time Transfer)
CONFIG_RTT_CONSOLE=y

# Choose SEGGER RTT as the backend (most common)
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
# Re-init the RTT control block unconditionally on every boot. The CB lives in
# a persistent section (not zeroed by startup), so the default strong-check
# mode reuses offsets left by the previous boot: the ring stays full of stale
# data and the skip-mode log writer drops everything new. Fresh ring per boot.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# Workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Enable events
CONFIG_EVENTS=y

# CRC32C for the link-protocol per-frame integrity feature (serial.c).
CONFIG_CRC=y
# The ARM MPU's default-deny background region blocks peripheral accesses
# (0x40000000+) that the SPU (configured by TF-M) is supposed to allow.
# The SPU handles all access control for the NS world; the ARM MPU is
# redundant and causes an MPU fault at boot when the NS image first
# touches a peripheral register.
CONFIG_ARM_MPU=n