CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
CONFIG_NRF_WIFI_RPU_RECOVERY=y
# Low power must be disabled for monitor-mode raw RX capture: with LPM the
# nRF7002 RPU puts the radio to sleep after ~10 ms idle, and in monitor mode
# there is no beacon/DTIM to wake it, so air frames are never captured.
# (Reference: nrf/tests/drivers/nrf_wifi/raw_tx_rx/prj.conf.)
# Note: this also disables CONFIG_NRF_WIFI_RPU_RECOVERY (depends on LPM).
CONFIG_NRF_WIFI_LOW_POWER=n
# Fixed MAC address (OTP read may fail on this board)
CONFIG_WIFI_FIXED_MAC_ADDRESS_ENABLED=y
CONFIG_WIFI_FIXED_MAC_ADDRESS="02:00:00:00:00:01"

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=n
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=n

# Raw 802.11 frame injection + capture (data connectivity testing):
# - TX: an AF_PACKET socket carries a raw_tx header + 802.11 frame; the driver
#   recognizes the magic number and transmits the frame without TCP/IP.
# - RX: with the packet filter set to WIFI_PACKET_FILTER_ALL the driver
#   delivers captured air frames (including one it just transmitted) back on an
#   AF_PACKET socket, so a transmitted test frame can be verified over serial.
CONFIG_NRF70_RAW_DATA_TX=y
CONFIG_NRF70_RAW_DATA_RX=y
CONFIG_NRF70_PROMISC_DATA_RX=y

# Required for net_capture_pkt() to deliver sniffer frames to AF_PACKET
# sockets. Without this, the monitor-mode RX path is a no-op.
CONFIG_NET_CAPTURE=y

CONFIG_NET_PKT_RX_COUNT=60
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16

# Below section is the primary contributor to SRAM and is currently
# tuned for performance, but this will be revisited in the future.
CONFIG_NET_BUF_RX_COUNT=60
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=37000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=100000
CONFIG_NET_TC_TX_COUNT=1

#CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_INIT_STACKS=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_NET_SOCKETS_POLL_MAX=10

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_STA_SAMPLE_START_WIFI_THREAD_STACK_SIZE=5200

# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_SHELL_CMDS_RESIZE=n


# Kernel options
CONFIG_ENTROPY_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048

#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.99"
#CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
#CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Nanopb
CONFIG_NANOPB=y

# Bluetooth LE
# The controller is the nRF5340 on-chip SoftDevice Controller running on the
# network core (the ipc_radio netcore image, see Kconfig.sysbuild). The
# application core exposes a raw HCI channel to the host over the common
# link protocol (traffic type HCI, see src/bt_proxy.c).
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

# Serial transport: the nRF5340 target USB connector (see app.overlay)
# exposes the common link protocol bus as USB CDC-ACM (CDC_ACM_0).
# The J-Link USB connector carries only SWD flash/debug and SEGGER RTT.

# Enable USB Subsystem (new USB device stack)
CONFIG_USB_DEVICE_STACK_NEXT=y

# Enable CDC ACM class for USB device stack next
CONFIG_USBD_CDC_ACM_CLASS=y

# Initialize and enable CDC ACM serial backend at boot
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
# Single instance mode registers "cdc_acm_0" = first zephyr,cdc-acm-uart node
# (cdc_serial_uart, the multiplexer's USB backend bound by serial_usb.c).
# MULTIPLE_INSTANCES=y would instead only expose the chosen console/shell/mcumgr
# UARTs, leaving the multiplexer port unregistered and invisible to the host.
CONFIG_CDC_ACM_SERIAL_MULTIPLE_INSTANCES=n

# Temporary USB VID/PID for testing
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_PID=0x0001
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="My Zephyr CDC-ACM Device"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Test Vendor"

# Serial
CONFIG_SERIAL=y
 # Needed for USB CDC ACM. Aysynchronous serial port
# API would be better for all other serial ports.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable RTT (Real-Time Transfer)
CONFIG_RTT_CONSOLE=y

# Choose SEGGER RTT as the backend (most common)
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=131072
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=64
# Re-init the RTT control block unconditionally on every boot. The CB lives in
# a persistent section (not zeroed by startup), so the default strong-check
# mode reuses offsets left by the previous boot: the ring stays full of stale
# data and the skip-mode log writer drops everything new. Fresh ring per boot.
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Enable events
CONFIG_EVENTS=y

# CRC32C for the link-protocol per-frame integrity feature (serial.c).
CONFIG_CRC=y
CONFIG_CRC32_C=y