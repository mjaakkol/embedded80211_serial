description: |
  Virtual Bluetooth HCI driver backed by the embedded80211 link-protocol bus.
  H:4 HCI traffic is proxied to a radio co-processor over the serial link;
  this is the host-role mirror of the device's BT HCI proxy.

compatible: "embedded80211,bt-hci-virtual"
