description: |
  Virtual Wi-Fi L2 interface backed by the embedded80211 link-protocol bus.
  Management requests and data frames are proxied to a radio co-processor
  over the serial link; this is the host-role mirror of the device's
  Wi-Fi management/data proxies.

compatible: "embedded80211,virt-wifi"
