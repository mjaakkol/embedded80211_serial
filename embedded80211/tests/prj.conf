CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Disable most drivers/features to keep test binary small
CONFIG_USB_DEVICE_STACK=n
CONFIG_NETWORKING=n

# Enable only what's needed for core tests
CONFIG_MINIMAL_LIBC=y

# CRC32C for the link-protocol integrity tests (serial_frame_crc / crc32_c)
CONFIG_CRC=y
CONFIG_CRC32_C=y
